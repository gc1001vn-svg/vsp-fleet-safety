<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2540">
<title>Phân tích hồ sơ kiểm tra tàu — XN VTB&CTL</title>
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNgYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==">
<style>
  :root{
    --ink:#0A2540; --ink2:#3C5A73; --line:#D3DCE4; --bg:#EEF2F5;
    --acc:#E05A00; --ok:#0F7A4A; --ng:#C42B1C; --na:#7A8A99; --warn:#B8860B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); padding-bottom:78px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  body.modal-open{position:fixed;left:0;right:0;width:100%;overflow:hidden}

  header.top{position:sticky;top:0;z-index:15;background:var(--ink);color:#fff;
    padding:12px 14px 0;padding-top:calc(12px + env(safe-area-inset-top))}
  .top-in{max-width:820px;margin:0 auto}
  .brand b{font-size:16px;letter-spacing:.01em}
  .brand span{margin-left:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{flex:1 0 auto;background:none;border:0;color:rgba(255,255,255,.62);font:inherit;
    font-size:12.5px;font-weight:650;letter-spacing:.02em;padding:9px 12px 10px;cursor:pointer;
    border-bottom:3px solid transparent;white-space:nowrap}
  .tab.on{color:#fff;border-bottom-color:var(--acc)}

  main{max-width:820px;margin:0 auto;padding:14px 12px 20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-bottom:11px}
  .card h3{margin:0 0 9px;font-size:14.5px;font-weight:700}
  .muted{color:var(--ink2);font-size:12.5px;line-height:1.6}
  .grp{margin:16px 0 8px;padding-left:2px}
  .grp span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}

  label.f{display:block;margin-bottom:9px}
  label.f b{display:block;font-size:11.5px;font-weight:650;color:var(--ink2);margin-bottom:4px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;
    font-family:inherit;font-size:16px;color:var(--ink);background:#fff}
  textarea{resize:vertical;min-height:64px;line-height:1.5}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--acc)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

  button.b{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;
    padding:10px 13px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
  button.b:active{background:#F2F5F8}
  button.b.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.b.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
  button.b.dan{color:var(--ng);border-color:#EFC8C3}
  .btns{display:flex;gap:8px;flex-wrap:wrap}

  .ship,.ky{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:9px;
    border-left:5px solid var(--acc)}
  .ship h4,.ky h4{margin:0 0 4px;font-size:14.5px;font-weight:700}
  .ky .meta{font-size:12px;color:var(--ink2);line-height:1.55}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;
    border-radius:20px;border:1px solid var(--line);color:var(--ink2);margin-right:5px}
  .pill.nc{color:var(--ng);border-color:#EFC8C3;background:#FDF0EE}
  .pill.obs{color:var(--warn);border-color:#E7D9A8;background:#FFFBEF}
  .pill.vp{color:var(--ng);border-color:#EFC8C3;background:#FDF0EE}
  .pill.kn{color:var(--ok);border-color:#BFE0CE;background:#EFF7F2}
  .pill.qh{color:#fff;background:var(--ng);border-color:var(--ng)}
  .pill.done{color:var(--ok);border-color:#BFE0CE;background:#EFF7F2}

  .fi{border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;background:#fff}
  .fi textarea{min-height:52px;margin-bottom:7px}
  .fi .r{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
  .fi .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:7px}
  .fi select,.fi input{font-size:15px;padding:7px 8px}
  .fi .del{border:0;background:none;color:var(--ng);font:inherit;font-size:12.5px;font-weight:650;
    padding:2px 0;cursor:pointer}

  .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:20px;line-height:1.2}
  .stat span{font-size:10.5px;color:var(--ink2);letter-spacing:.03em}

  .bar{margin-bottom:7px}
  .bar .lb{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
  .bar .tr{height:9px;background:#E4EAEF;border-radius:5px;overflow:hidden}
  .bar .fl{height:100%;background:var(--acc);border-radius:5px}
  .bar.g .fl{background:var(--ok)}
  .bar.r .fl{background:var(--ng)}

  .lap{border-left:4px solid var(--ng);background:#FDF0EE;border-radius:0 8px 8px 0;
    padding:10px 12px;margin-bottom:9px}
  .lap b{font-size:13.5px}
  .lap .k{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.6}
  .good{border-left:4px solid var(--ok);background:#EFF7F2;border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:9px}
  .good b{font-size:13.5px}

  .empty{color:var(--na);font-size:13px;text-align:center;padding:22px 10px;line-height:1.6}

  .barbot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px}
  .barbot .in{max-width:820px;margin:0 auto;display:flex;gap:8px;width:100%}
  .barbot button{flex:1}

  .sheet{position:fixed;inset:0;z-index:40;background:rgba(10,37,64,.55);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .sheet .box{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;
    padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
  .sheet .box .in{max-width:820px;margin:0 auto}
  .sheet h2{margin:0 0 12px;font-size:16px}
  #save{font-size:11px;color:var(--ink2);text-align:center;padding:4px 0 0}

  @media (max-width:430px){
    .stat{grid-template-columns:repeat(2,1fr)}
    .row3{grid-template-columns:1fr}
    .fi .r3{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><b>Phân tích hồ sơ kiểm tra tàu</b><span>XN VTB&CTL</span></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<main>
  <div id="view"></div>
  <div id="save"></div>
</main>

<div class="barbot"><div class="in" id="bar"></div></div>

<div class="sheet" id="sheet" hidden><div class="box"><div class="in" id="sheetIn"></div></div></div>

<script>
/* =======================================================================
   PHÂN TÍCH HỒ SƠ KIỂM TRA TÀU — XN Vận tải biển & Công tác lặn
   Công cụ độc lập, 1 file, chạy offline, dữ liệu lưu trong máy.
   Nhập kết quả các kỳ kiểm tra (cấp III, cấp IV, tình trạng tàu, PSC…),
   phân tích lỗi lặp lại và xuất báo cáo điểm mạnh – điểm yếu.
   ES5 thuần để chạy được trên Safari iOS đời cũ.
   ======================================================================= */

var DX_XMLDECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';
var DX_NS =
  ' xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"' +
  ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"' +
  ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"' +
  ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"' +
  ' xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
var DX_FONT = "Times New Roman";
var DX_CW = 10205;   /* b\u1ec1 r\u1ed9ng v\u00f9ng in tr\u00ean kh\u1ed5 A4 (twips) */
var EMU_CM = 360000, EMU_PX = 9525;
var _crcT = (function () {
  var t = new Uint32Array(256), c, n, k;
  for (n = 0; n < 256; n++) {
    c = n;
    for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function _crc32(u8) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < u8.length; i++) c = _crcT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function _enc(s) { return new TextEncoder().encode(s); }
function _dataUrlBytes(u) {
  var bin = atob(u.substring(u.indexOf(",") + 1));
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function _zipStore(files) {
  var parts = [], cdir = [], off = 0;
  function w16(v) { return [v & 255, (v >>> 8) & 255]; }
  function w32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  /* Dấu thời gian kiểu DOS. Ngày 0 / tháng 0 là giá trị KHÔNG hợp lệ và bị một số
     trình đọc (LibreOffice, vài ứng dụng xem file trên điện thoại) từ chối mở. */
  var now = new Date();
  var dosY = Math.min(127, Math.max(0, now.getFullYear() - 1980));
  var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  var dosDate = (dosY << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  files.forEach(function (f) {
    var nm = _enc(f.name), d = f.data, crc = _crc32(d);
    parts.push(new Uint8Array([].concat([80, 75, 3, 4], w16(20), w16(0), w16(0), w16(dosTime), w16(dosDate),
      w32(crc), w32(d.length), w32(d.length), w16(nm.length), w16(0))), nm, d);
    cdir.push(new Uint8Array([].concat([80, 75, 1, 2], w16(20), w16(20), w16(0), w16(0), w16(dosTime), w16(dosDate),
      w32(crc), w32(d.length), w32(d.length), w16(nm.length), w16(0), w16(0), w16(0), w16(0),
      w32(0), w32(off))), nm);
    off += 30 + nm.length + d.length;
  });
  var cdSize = cdir.reduce(function (s, a) { return s + a.length; }, 0);
  var all = parts.concat(cdir, [new Uint8Array([].concat([80, 75, 5, 6], w16(0), w16(0),
    w16(files.length), w16(files.length), w32(cdSize), w32(off), w16(0)))]);
  var tot = all.reduce(function (s, a) { return s + a.length; }, 0);
  var out = new Uint8Array(tot), p = 0;
  all.forEach(function (a) { out.set(a, p); p += a.length; });
  return out;
}
/* \u0110\u1ecdc k\u00edch th\u01b0\u1edbc \u1ea3nh tr\u1ef1c ti\u1ebfp t\u1eeb header PNG/JPEG (kh\u00f4ng c\u1ea7n gi\u1ea3i m\u00e3 \u1ea3nh) */
function _imgSize(b) {
  if (b.length > 24 && b[0] === 0x89 && b[1] === 0x50)
    return { w: ((b[16] << 24 | b[17] << 16 | b[18] << 8 | b[19]) >>> 0),
             h: ((b[20] << 24 | b[21] << 16 | b[22] << 8 | b[23]) >>> 0) };
  if (b[0] === 0xFF && b[1] === 0xD8) {
    var i = 2;
    while (i < b.length - 9) {
      if (b[i] !== 0xFF) { i++; continue; }
      var m = b[i + 1];
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC)
        return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8] };
      i += 2 + ((b[i + 2] << 8) | b[i + 3]);
    }
  }
  return { w: 4, h: 3 };
}
function _xe(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---- Kh\u1ed1i d\u1ef1ng WordprocessingML ---- */
function dxRun(text, o) {
  o = o || {};
  var f = o.font || DX_FONT, sz = o.sz || 26;
  return '<w:r><w:rPr><w:rFonts w:ascii="' + f + '" w:hAnsi="' + f + '" w:cs="' + f + '"/>' +
    (o.b ? "<w:b/>" : "") + (o.i ? "<w:i/>" : "") + (o.u ? '<w:u w:val="single"/>' : "") +
    '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/></w:rPr>' +
    '<w:t xml:space="preserve">' + _xe(text) + "</w:t></w:r>";
}
function dxBr() { return "<w:r><w:br/></w:r>"; }
function dxPara(runs, o) {
  o = o || {};
  return "<w:p><w:pPr>" +
    (o.brk ? "<w:pageBreakBefore/>" : "") +
    (o.align ? '<w:jc w:val="' + o.align + '"/>' : "") +
    (o.ind ? '<w:ind w:left="' + o.ind + '"/>' : "") +
    '<w:spacing w:before="' + (o.before || 0) + '" w:after="' +
      (o.after == null ? 40 : o.after) + '" w:line="240" w:lineRule="auto"/>' +
    "</w:pPr>" + (runs || "") + "</w:p>";
}
function dxField(instr, o) {
  return '<w:r><w:fldChar w:fldCharType="begin"/></w:r>' +
    '<w:r><w:instrText xml:space="preserve"> ' + instr + ' </w:instrText></w:r>' +
    '<w:r><w:fldChar w:fldCharType="separate"/></w:r>' + dxRun("1", o) +
    '<w:r><w:fldChar w:fldCharType="end"/></w:r>';
}
function _dxBorders(mode) {
  var sides = ["top", "left", "bottom", "right", "insideH", "insideV"];
  return "<w:tblBorders>" + sides.map(function (s) {
    var on = mode === "full" || (mode === "top" && s === "top");
    return on
      ? '<w:' + s + ' w:val="single" w:sz="8" w:space="0" w:color="000000"/>'
      : '<w:' + s + ' w:val="none" w:sz="0" w:space="0" w:color="auto"/>';
  }).join("") + "</w:tblBorders>";
}
function dxCell(w, content, o) {
  o = o || {};
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' +
    (o.span ? '<w:gridSpan w:val="' + o.span + '"/>' : "") +
    (o.vAlign ? '<w:vAlign w:val="' + o.vAlign + '"/>' : "") + "</w:tcPr>" +
    (content || "<w:p/>") + "</w:tc>";
}
function dxRow(cells, h) {
  return "<w:tr>" +
    (h ? '<w:trPr><w:trHeight w:hRule="atLeast" w:val="' + h + '"/></w:trPr>' : "") +
    cells + "</w:tr>";
}
function dxTable(grid, rows, mode) {
  var total = grid.reduce(function (a, b) { return a + b; }, 0);
  return '<w:tbl><w:tblPr><w:tblW w:w="' + total + '" w:type="dxa"/>' +
    '<w:tblLayout w:type="fixed"/>' + _dxBorders(mode || "full") +
    '<w:tblCellMar><w:top w:w="30" w:type="dxa"/><w:left w:w="70" w:type="dxa"/>' +
    '<w:bottom w:w="30" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar>' +
    "</w:tblPr><w:tblGrid>" +
    grid.map(function (g) { return '<w:gridCol w:w="' + g + '"/>'; }).join("") +
    "</w:tblGrid>" + rows + "</w:tbl>";
}
function dxImage(rid, cx, cy, id) {
  return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">' +
    '<wp:extent cx="' + cx + '" cy="' + cy + '"/><wp:effectExtent l="0" t="0" r="0" b="0"/>' +
    '<wp:docPr id="' + id + '" name="Anh' + id + '"/>' +
    '<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
    '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
    "<pic:pic><pic:nvPicPr><pic:cNvPr id=\"" + id + "\" name=\"Anh" + id + "\"/><pic:cNvPicPr/></pic:nvPicPr>" +
    '<pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
    '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
    '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>' +
    "</a:graphicData></a:graphic></wp:inline></w:drawing></w:r>";
}
function dxFld(v, n) {
  v = (v == null ? "" : String(v)).trim();
  return v ? v : dots(n);
}



/* ===================== DANH MỤC ===================== */
var LOAI_KY = [
  ["c4",  "Kiểm tra cấp IV",              "VSP-000-ATMT-452/F-001"],
  ["c3",  "Kiểm tra cấp III / ISM nội bộ", "VTB07-02-04A"],
  ["tt",  "Kiểm tra tình trạng tàu",      "Báo cáo Phòng Hàng hải"],

  ["dk",  "Đăng kiểm",                    "VR / IACS"],

  ["kh",  "Khác",                         ""]
];
var BO_PHAN = [
  ["boong",  "Boong"],
  ["may",    "Máy"],
  ["dien",   "Điện"],
  ["cuusinh","Cứu sinh"],
  ["cuuhoa", "Cứu hỏa"],
  ["hoso",   "Hồ sơ – giấy tờ"],
  ["bep",    "Bếp – sinh hoạt"],
  ["nang",   "Thiết bị nâng"],
  ["moitruong","Môi trường"],
  ["anninh", "An ninh"],
  ["nguoi",  "Con người – huấn luyện"],
  ["khac",   "Khác"]

var PHAN_LOAI = [
  ["nc",  "NC — Không phù hợp"],
  ["vp",  "Vi phạm"],
  ["obs", "OBS — Ghi nhận"],
  ["kn",  "Khuyến nghị"]
];
function nameOf(list, k) {
  for (var i = 0; i < list.length; i++) if (list[i][0] === k) return list[i][1];
  return k || "";
}
function refOf(list, k) {
  for (var i = 0; i < list.length; i++) if (list[i][0] === k) return list[i][2] || "";
  return "";
}

/* ===================== DỮ LIỆU ===================== */
var KEY = "atskmt-phantich-hoso-tau-v1";
var DB = { ships: [], ky: [] };
var tab = "ky";
var curShip = "";
var curKy = "";

function uid() { return "x" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var v = JSON.parse(raw);
      DB.ships = v.ships || [];
      DB.ky = v.ky || [];
      curShip = v.curShip || "";
      tab = v.tab || "ky";
    }
  } catch (e) {}
}
var saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try {
      localStorage.setItem(KEY, JSON.stringify({ ships: DB.ships, ky: DB.ky, curShip: curShip, tab: tab }));
      document.getElementById("save").textContent = "Đã lưu " + new Date().toLocaleTimeString("vi-VN");
    } catch (e) {
      document.getElementById("save").textContent = "Chưa lưu được — dung lượng trình duyệt đã đầy";
    }
  }, 400);
}

/* ===================== TIỆN ÍCH ===================== */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function today() {
  var d = new Date(), m = d.getMonth() + 1, n = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (n < 10 ? "0" : "") + n;
}
function fmtDate(iso) {
  if (!iso) return "…/…/……";
  var p = String(iso).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
}
function shipById(id) {
  for (var i = 0; i < DB.ships.length; i++) if (DB.ships[i].id === id) return DB.ships[i];
  return null;

/* Đọc file .docx: giải nén word/document.xml rồi bóc chữ.
   Bảng trong Word thành dòng, mỗi ô cách nhau bằng dấu tab. */
function docxText(file, cb) {
  var fr = new FileReader();
  fr.onload = function (e) {
    var buf = e.target.result;
    var entry;
    try { entry = zipFind(buf, "word/document.xml"); }
    catch (err) { cb(null, "Không đọc được cấu trúc file .docx"); return; }
    if (!entry) { cb(null, "Không tìm thấy nội dung trong file .docx"); return; }
    function done(bytes) {
      var xml;
      try { xml = new TextDecoder("utf-8").decode(bytes); }
      catch (e2) { cb(null, "Không giải mã được nội dung"); return; }
      cb(xmlToText(xml), null);
    }
    if (entry.method === 0) { done(entry.data); return; }
    if (typeof DecompressionStream === "undefined") {
      cb(null, "Trình duyệt này chưa hỗ trợ giải nén file .docx. Hãy dùng nút “Dán bảng từ Word”.");
      return;
    }
    try {
      var ds = new DecompressionStream("deflate-raw");
      var w = ds.writable.getWriter();
      w.write(entry.data); w.close();
      new Response(ds.readable).arrayBuffer().then(function (ab) {
        done(new Uint8Array(ab));
      })["catch"](function () { cb(null, "Không giải nén được file .docx"); });
    } catch (e3) {
      cb(null, "Không giải nén được file .docx trên trình duyệt này");
    }
  };
  fr.onerror = function () { cb(null, "Không đọc được file"); };
  fr.readAsArrayBuffer(file);
}
/* Tìm một phần trong file ZIP (docx là file ZIP) */
function zipFind(buf, want) {
  var u = new Uint8Array(buf), dv = new DataView(buf), i;
  var eocd = -1;
  for (i = u.length - 22; i >= 0 && i > u.length - 66000; i--) {
    if (u[i] === 0x50 && u[i + 1] === 0x4b && u[i + 2] === 0x05 && u[i + 3] === 0x06) { eocd = i; break; }
  }
  if (eocd < 0) return null;
  var n = dv.getUint16(eocd + 10, true), off = dv.getUint32(eocd + 16, true), p = off;
  for (i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) return null;
    var method = dv.getUint16(p + 10, true);
    var csize = dv.getUint32(p + 20, true);
    var nlen = dv.getUint16(p + 28, true);
    var elen = dv.getUint16(p + 30, true);
    var clen = dv.getUint16(p + 32, true);
    var lho = dv.getUint32(p + 42, true);
    var nm = "";
    for (var j = 0; j < nlen; j++) nm += String.fromCharCode(u[p + 46 + j]);
    if (nm === want) {
      var lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
      var st = lho + 30 + lnl + lel;
      return { method: method, data: u.subarray(st, st + csize) };
    }
    p += 46 + nlen + elen + clen;
  }
  return null;
}
function xmlToText(x) {
  /* Giu dung cau truc bang: moi hang mot dong, moi o cach nhau bang tab.
     Doan van trong cung mot o chi ngan bang ky tu danh dau de noi lai sau. */
  var M = "\u0001";
  x = x.split("</w:p>").join(M);
  x = x.split("</w:tc>").join("\t");
  x = x.split("</w:tr>").join("\n");
  x = x.split("</w:tbl>").join("\n");
  x = x.split("<w:tbl>").join("\n");
  x = x.split("<w:tbl ").join("\n<w:tbl ");
  x = x.replace(/<[^>]*>/g, "");
  x = x.split("&amp;").join("&").split("&lt;").join("<").split("&gt;").join(">")
       .split("&quot;").join('"').split("&apos;").join("'");
  var lines = x.split("\n"), out = [], i;
  for (i = 0; i < lines.length; i++) {
    /* trong bang: doan trong cung mot o noi lai bang dau cach
       ngoai bang: moi doan la mot dong rieng */
    if (lines[i].indexOf("\t") >= 0) out.push(lines[i].split(M).join(" "));
    else out.push(lines[i].split(M).join("\n"));
  }
  return out.join("\n");
}

/* Tach van ban thanh cac dong phat hien.
   Uu tien cac hang cua BANG; tai lieu khong co bang thi moi lay tung doan. */
function parseRows(text, loai, ngayKy) {
  var lines = String(text || "").split(/\r?\n/), i, c, hasTable = false;
  for (i = 0; i < lines.length; i++) if (lines[i].indexOf("\t") >= 0) { hasTable = true; break; }
  var map = COT[loai] || null, out = [];
  for (i = 0; i < lines.length; i++) {
    var ln = lines[i];
    if (hasTable && ln.indexOf("\t") < 0) continue;          /* bo phan ngoai bang */
    var cells = ln.split("\t");
    for (c = 0; c < cells.length; c++) cells[c] = cells[c].replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
    while (cells.length && !cells[cells.length - 1]) cells.pop();
    if (!cells.length) continue;

    var nonEmpty = 0;
    for (c = 0; c < cells.length; c++) if (cells[c]) nonEmpty++;
    if (!nonEmpty) continue;
    if (nonEmpty === 1 && hasTable) continue;                 /* hang de muc trong bang */

    var f = { nd: "", bp: "khac", pl: "nc", cc: "", han: "", tn: "", tt: "open" };
    var shift = (cells[0] && cells[0].length > 15) ? -1 : 0;  /* bang khong co cot so thu tu */

    if (map && hasTable) {
      f.nd = cells[map.nd + shift] || "";
      if (map.han != null) f.han = parseDate(cells[map.han + shift] || "");
      if (map.cc != null) f.cc = (cells[map.cc + shift] || "").substring(0, 60);
      if (map.tn != null) f.tn = (cells[map.tn + shift] || "").substring(0, 90);
      if (map.pl != null) {
        var pv = noDia(cells[map.pl + shift] || "");
        if (pv.indexOf("obs") >= 0 || pv.indexOf("ghi nhan") >= 0) f.pl = "obs";
      }
      if (!f.nd) {
        for (c = 0; c < cells.length; c++) if (cells[c].length > f.nd.length) f.nd = cells[c];
      }
    } else {
      var best = "";
      for (c = 0; c < cells.length; c++) {
        var v = cells[c];
        if (/^\d{1,3}[.)]?$/.test(v)) continue;
        var d = parseDate(v);
        if (d && !f.han) { f.han = d; continue; }
        if (v.length > best.length) best = v;
      }
      f.nd = best;
    }
    if (!f.nd || f.nd.length < 15 || words(f.nd) < 4) continue;
    if (looksBoiler(f.nd)) continue;

    var rest = noDia(cells.join(" "));
    if (rest.indexOf("da khac phuc") >= 0 || rest.indexOf("tau da ") >= 0 ||
        rest.indexOf("da xu ly") >= 0 || rest.indexOf("da sap xep") >= 0 ||
        rest.indexOf("da ve sinh") >= 0 || rest.indexOf("da kiem tra") >= 0) f.tt = "done";
    if (!f.han && rest.indexOf("ngay lap tuc") >= 0) f.han = ngayKy || today();
    f.bp = guessBP(f.nd);
    out.push(f);
  }
  return out;
}

function parseDate(v) {
  var m = String(v).match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (!m) return "";
  var d = parseInt(m[1], 10), mo = parseInt(m[2], 10), y = parseInt(m[3], 10);
  if (y < 100) y += 2000;
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return "";
  return y + "-" + (mo < 10 ? "0" : "") + mo + "-" + (d < 10 ? "0" : "") + d;
}

function guessBP(s) {
  var t = " " + noDia(s) + " ", best = "khac", bestN = 0;
  for (var i = 0; i < BP_HINT.length; i++) {
    var ws = BP_HINT[i][1].split(" "), n = 0;
    for (var j = 0; j < ws.length; j++) if (ws[j].length > 2 && t.indexOf(" " + ws[j]) >= 0) n++;
    if (n > bestN) { bestN = n; best = BP_HINT[i][0]; }
  }
  return best;
}

/* ===================== PHÂN TÍCH ===================== */
function analyse(sid) {
  var list = sid ? kyOfShip(sid) : DB.ky.slice().sort(function (a, b) {
    return (b.ngay || "").localeCompare(a.ngay || "");
  });
  var all = [], i, j;
  for (i = 0; i < list.length; i++) {
    var k = list[i], its = k.items || [];
    for (j = 0; j < its.length; j++) {
      all.push({ f: its[j], k: k });
    }
  }
  var byBP = {}, byLoai = {}, byPL = {}, nDone = 0, nQh = 0;
  for (i = 0; i < all.length; i++) {
    var f = all[i].f;
    byBP[f.bp] = (byBP[f.bp] || 0) + 1;
    byPL[f.pl] = (byPL[f.pl] || 0) + 1;
    byLoai[all[i].k.loai] = (byLoai[all[i].k.loai] || 0) + 1;
    if (f.tt === "done") nDone++;
    if (isOverdue(f)) nQh++;
  }
  /* lỗi lặp lại: nội dung giống nhau xuất hiện ở từ 2 kỳ khác nhau trở lên */
  var groups = [], used = {};
  for (i = 0; i < all.length; i++) {
    if (used[i]) continue;
    var g = [all[i]]; used[i] = 1;
    for (j = i + 1; j < all.length; j++) {
      if (used[j]) continue;
      if (all[j].f.bp !== all[i].f.bp) continue;
      if (similar(all[i].f.nd, all[j].f.nd) >= 0.5) { g.push(all[j]); used[j] = 1; }
    }
    if (g.length > 1) {
      var kys = {}, n = 0;
      for (var q = 0; q < g.length; q++) if (!kys[g[q].k.id]) { kys[g[q].k.id] = 1; n++; }
      if (n > 1) groups.push({ items: g, nKy: n });
    }
  }
  groups.sort(function (a, b) { return b.nKy - a.nKy || b.items.length - a.items.length; });
  return {
    list: list, all: all, byBP: byBP, byLoai: byLoai, byPL: byPL,
    nDone: nDone, nQh: nQh, lap: groups
  };
}
function strongWeak(A) {
  var manh = [], yeu = [], i;
  var n = A.all.length;
  if (!n) return { manh: manh, yeu: yeu };
  var tyle = Math.round(A.nDone * 100 / n);

  /* điểm mạnh */
  if (tyle >= 80) manh.push("Tỷ lệ khắc phục đạt " + tyle + "% tổng số phát hiện — công tác đóng tồn đọng được duy trì tốt.");
  if (!A.nQh) manh.push("Không còn phát hiện nào quá hạn khắc phục.");
  var covered = {};
  for (i = 0; i < A.all.length; i++) covered[A.all[i].f.bp] = 1;
  var clean = [];
  for (i = 0; i < BO_PHAN.length; i++) if (!covered[BO_PHAN[i][0]]) clean.push(BO_PHAN[i][1]);
  if (clean.length && A.list.length >= 2) {
    manh.push("Qua " + A.list.length + " kỳ kiểm tra, các mảng sau không bị nêu phát hiện nào: " + clean.join(", ") + ".");
  }
  if (A.list.length >= 2) {
    var m = A.list[0].items ? A.list[0].items.length : 0;
    var p = A.list[1].items ? A.list[1].items.length : 0;
    if (m < p) manh.push("Kỳ gần nhất (" + fmtDate(A.list[0].ngay) + ") có " + m +
      " phát hiện, giảm so với kỳ trước (" + p + ") — xu hướng cải thiện.");
  }
  var nNC = (A.byPL.nc || 0) + (A.byPL.vp || 0);
  if (n && nNC * 100 / n <= 30) manh.push("Phần lớn phát hiện ở mức ghi nhận/khuyến nghị, số không phù hợp và vi phạm chỉ chiếm " +
    Math.round(nNC * 100 / n) + "%.");

  /* điểm yếu */
  if (A.lap.length) {
    yeu.push("Có " + A.lap.length + " nhóm phát hiện LẶP LẠI qua nhiều kỳ kiểm tra — dấu hiệu hệ thống quản lý chưa xử lý tận gốc, cần nêu thành vấn đề hệ thống chứ không chỉ sửa hiện tượng.");
  }
  if (A.nQh) yeu.push("Còn " + A.nQh + " phát hiện QUÁ HẠN khắc phục chưa đóng.");
  if (tyle < 60) yeu.push("Tỷ lệ khắc phục mới đạt " + tyle + "% — tồn đọng kéo dài.");
  var top = [], k;
  for (k in A.byBP) if (A.byBP.hasOwnProperty(k)) top.push([k, A.byBP[k]]);
  top.sort(function (a, b) { return b[1] - a[1]; });
  if (top.length) {
    var t3 = top.slice(0, 3).map(function (x) { return nameOf(BO_PHAN, x[0]) + " (" + x[1] + ")"; });
    yeu.push("Tập trung nhiều phát hiện nhất ở: " + t3.join(", ") + " — nên ưu tiên nguồn lực và huấn luyện vào các mảng này.");
  }
  if (n && nNC * 100 / n > 50) yeu.push("Không phù hợp và vi phạm chiếm " + Math.round(nNC * 100 / n) +
    "% tổng phát hiện — mức độ nghiêm trọng cao.");
  return { manh: manh, yeu: yeu };
}

function bars(obj, list, cls) {
  var arr = [], k, max = 0;
  for (k in obj) if (obj.hasOwnProperty(k)) { arr.push([k, obj[k]]); if (obj[k] > max) max = obj[k]; }
  arr.sort(function (a, b) { return b[1] - a[1]; });
  if (!arr.length) return '<div class="muted">Chưa có dữ liệu.</div>';
  return arr.map(function (x) {
    var w = max ? Math.round(x[1] * 100 / max) : 0;
    return '<div class="bar ' + (cls || "") + '"><div class="lb"><span>' + esc(nameOf(list, x[0])) +
      "</span><b>" + x[1] + '</b></div><div class="tr"><div class="fl" style="width:' + w + '%"></div></div></div>';
  }).join("");
}

    { name: "[Content_Types].xml", data: _enc(ctypes) },

/* ===================== SINH BÁO CÁO WORD ===================== */
function thTop(txt1, txt2, w) {
  return dxCell(w, dxPara(dxRun(txt1, { b: true, sz: 22 }) + (txt2 ? dxBr() + dxRun(txt2, { b: true, sz: 22 }) : ""),
    { align: "center", after: 0 }), { vAlign: "center" });
}
function tdC(w, txt, o) {
  o = o || {};
  var lines = String(txt == null ? "" : txt).split("\n"), s = "";
  for (var i = 0; i < lines.length; i++) {
    s += dxPara(dxRun(lines[i], { sz: o.sz || 22, b: o.b }), { align: o.align, after: 0 });
  }
  return dxCell(w, s || "<w:p/>");
}
function secRow(w, txt) {
  return dxRow(dxCell(w, dxPara(dxRun(txt, { b: true, sz: 22 }), { after: 0 }), { span: 9 }));
}

      (txt2 ? dxPara(dxRun(txt2, { b: true, sz: 21 }), { after: 0 }) : ""), { span: 6 }));
  }
  rows += sec("I. Các ghi nhận (Obs) và sự không phù hợp (NC)", "Observations and Non-conformities");

  /* nhóm theo bộ phận, đúng cách trình bày của biểu mẫu */
  var order = ["boong", "may", "dien", "cuusinh", "cuuhoa", "bep", "hoso", "nang", "moitruong", "anninh", "nguoi", "khac"];
  var nsec = 0, kn = [];
  for (var o = 0; o < order.length; o++) {
    var bp = order[o], grp = [];
    for (i = 0; i < its.length; i++) {
      if (its[i].pl === "kn") { if (o === 0) kn.push(its[i]); continue; }
      if (its[i].bp === bp) grp.push(its[i]);
    }
    if (!grp.length) continue;
    nsec++;
    rows += dxRow(dxCell(10205, dxPara(dxRun(nsec + ". Bộ phận " + nameOf(BO_PHAN, bp), { b: true, sz: 22 }), { after: 0 }), { span: 6 }));
    for (i = 0; i < grp.length; i++) {
      var f = grp[i];
      rows += dxRow(tdC(G[0], nsec + "." + (i + 1), { align: "center" }) + tdC(G[1], f.nd) +
        tdC(G[2], f.pl === "obs" ? "Obs" : "NC", { align: "center" }) + tdC(G[3], f.cc || "", { align: "center" }) +
        tdC(G[4], fmtDate(f.han), { align: "center" }) +
        tdC(G[5], (f.tt === "done" ? "Đã khắc phục. " : "") + (f.tn || "")));
    }
  }
  if (!nsec) {
    rows += dxRow(tdC(G[0], "1", { align: "center" }) + tdC(G[1], "Không phát hiện / None") +
      tdC(G[2], "") + tdC(G[3], "") + tdC(G[4], "") + tdC(G[5], ""));
  }
  rows += sec("II. Những khuyến nghị và đề xuất để nâng cao tình trạng an toàn cho tàu",
    "Recommendations and suggestions to improve the safety situation for ships");
  if (!kn.length) {
    rows += dxRow(tdC(G[0], "1", { align: "center" }) + tdC(G[1], "Không") + tdC(G[2], "") + tdC(G[3], "") +
      tdC(G[4], "") + tdC(G[5], ""));
  } else {
    for (i = 0; i < kn.length; i++) {
      rows += dxRow(tdC(G[0], String(i + 1), { align: "center" }) + tdC(G[1], kn[i].nd) + tdC(G[2], "") +
        tdC(G[3], kn[i].cc || "", { align: "center" }) + tdC(G[4], fmtDate(kn[i].han), { align: "center" }) +
        tdC(G[5], kn[i].tn || ""));
    }
  }
  b += dxTable(G, rows) + dxPara("", { after: 160 });

  b += dxPara(dxRun("* NC: sự không phù hợp / Non-conformity;  Obs: sự ghi nhận / Observation.", { i: true, sz: 20 }), { after: 200 });
  var GS = [3401, 3402, 3402];
  b += dxTable(GS, dxRow(
    dxCell(GS[0], dxPara(dxRun("DPA / Lãnh đạo Xí nghiệp", { b: true, sz: 21 }), { align: "center", after: 400 })) +
    dxCell(GS[1], dxPara(dxRun("Đánh giá viên / Auditor", { b: true, sz: 21 }), { align: "center", after: 400 })) +
    dxCell(GS[2], dxPara(dxRun("Đại diện tàu được đánh giá / Auditee", { b: true, sz: 21 }), { align: "center", after: 400 }))
  ), "none");

  return buildDocx(b, "DANH MỤC SỰ GHI NHẬN VÀ SỰ KHÔNG PHÙ HỢP", "XN VTB&CTL — VTB07-02-04A", "VTB07-02-04A");
}

/* --- 4. Báo cáo kết quả kiểm tra tình trạng tàu (công văn) --- */
function repTT(k) {
  var s = shipById(k.shipId), b = "", i;
  var its = k.items || [];
  var ten = s ? s.ten : "………";

  b += dxPara(dxRun("V/v: “Kết quả kiểm tra tình trạng kỹ thuật và đánh giá nội bộ tàu " + ten + "”", { i: true }), { after: 120 });
  b += dxPara(dxRun("Kính gửi:", { b: true }));
  b += dxPara(dxRun("- Giám đốc XN VTB&CTL;"));
  b += dxPara(dxRun("- Trưởng phòng TCNS XN VTB&CTL;"));
  b += dxPara(dxRun("- Trưởng phòng KH-KTT;"));
  b += dxPara(dxRun("- Trưởng phòng BDKT&SC XN VTB&CTL."), { after: 140 });
  b += dxPara(dxRun("BÁO CÁO", { b: true, sz: 30 }), { align: "center", after: 20 });
  b += dxPara(dxRun("ДОКЛАД", { b: true, sz: 24 }), { align: "center", after: 140 });

  b += dxPara(dxRun("Theo lịch kiểm tra tàu, ngày " + fmtDate(k.ngay) +
    " đoàn kiểm tra đã tiến hành đánh giá tàu " + ten + "."), { align: "both", after: 60 });
  b += dxPara(dxRun("Thành viên đoàn:"));
  var doan = String(k.doan || "").split("\n"), cnt = 0;
  for (i = 0; i < doan.length; i++) {
    if (!doan[i].replace(/\s/g, "")) continue;
    cnt++; b += dxPara(dxRun("- " + doan[i]));
  }
  if (!cnt) b += dxPara(dxRun("- ……………………………………"));
  b += dxPara(dxRun("Đoàn có ghi nhận một số điểm như sau:"), { before: 80, after: 60 });

  var G = [700, 4900, 2000, 2605];
  var rows = dxRow(thTop("TT", "No.", G[0]) + thTop("Những công việc phải làm", "", G[1]) +
    thTop("Khắc phục / thời hạn", "", G[2]) + thTop("Ý kiến của tàu", "", G[3]));
  var vp = [], kn = [];
  for (i = 0; i < its.length; i++) (its[i].pl === "kn" ? kn : vp).push(its[i]);
  if (!vp.length) {
    rows += dxRow(tdC(G[0], "1", { align: "center" }) + tdC(G[1], "Không phát hiện") + tdC(G[2], "") + tdC(G[3], ""));
  } else {
    for (i = 0; i < vp.length; i++) {
      var f = vp[i];
      rows += dxRow(tdC(G[0], String(i + 1), { align: "center" }) + tdC(G[1], f.nd) +
        tdC(G[2], f.han ? fmtDate(f.han) : "Ngay lập tức", { align: "center" }) +
        tdC(G[3], (f.tt === "done" ? "Tàu đã khắc phục. " : "") + (f.tn ? "Phụ trách: " + f.tn : "")));
    }
  }
  b += dxTable(G, rows) + dxPara("", { after: 120 });

  b += dxPara(dxRun("Kiến nghị đề xuất:", { b: true, sz: 24 }), { before: 80, after: 40 });
  if (!kn.length) b += dxPara(dxRun("- Không"));
  else for (i = 0; i < kn.length; i++) b += dxPara(dxRun("- " + kn[i].nd), { align: "both" });

  b += dxPara(dxRun("Kính báo cáo.", { b: true }), { before: 140, after: 240 });
  var GS = [5102, 5103];
  b += dxTable(GS, dxRow(
    dxCell(GS[0], dxPara(dxRun("Thành viên đoàn kiểm tra", { b: true }), { after: 500 })) +
    dxCell(GS[1], dxPara(dxRun("Thuyền trưởng tàu " + ten, { b: true }), { align: "center", after: 500 }))
  ), "none");
  b += dxPara(dxRun("Nơi nhận: - Như trên; - Lưu: XN VTB&CTL.", { i: true, sz: 20 }), { before: 120 });

  return buildDocx(b, "BÁO CÁO KẾT QUẢ KIỂM TRA TÌNH TRẠNG TÀU", "XN VTB&CTL · Vietsovpetro", "Kiểm tra tình trạng tàu");
}

/* ===================== TẢI FILE ===================== */
function saveBlob(bytes, filename) {
  var blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
}
function slug(s) {
  return noDia(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").substring(0, 40) || "bao-cao";
}

/* ===================== SỰ KIỆN ===================== */
document.getElementById("tabs").addEventListener("click", function (e) {
  var t = e.target.closest("[data-tab]");
  if (!t) return;
  tab = t.getAttribute("data-tab"); curKy = ""; save(); draw();
});
document.body.addEventListener("click", function (e) {
  var t;

  t = e.target.closest("[data-tab]");
  if (t && t.parentNode && t.parentNode.id !== "tabs") {
    tab = t.getAttribute("data-tab"); curKy = ""; save(); draw(); return;
  }
  if (e.target.id === "b-addship") { editShip(null); return; }
  t = e.target.closest("[data-shipedit]");
  if (t) { editShip(t.getAttribute("data-shipedit")); return; }
  t = e.target.closest("[data-shipdel]");
  if (t) {
    var sid = t.getAttribute("data-shipdel");
    if (!confirm("Xóa tàu này và toàn bộ kỳ kiểm tra của nó?")) return;
    DB.ships = DB.ships.filter(function (x) { return x.id !== sid; });
    DB.ky = DB.ky.filter(function (x) { return x.shipId !== sid; });
    if (curShip === sid) curShip = "";
    save(); draw(); return;
  }
  if (e.target.id === "b-addky") { addKy(); return; }
  t = e.target.closest("[data-kyopen]");
  if (t) { curKy = t.getAttribute("data-kyopen"); draw(); window.scrollTo(0, 0); return; }
  t = e.target.closest("[data-kydel]");
  if (t) {
    var kid = t.getAttribute("data-kydel");
    if (!confirm("Xóa kỳ kiểm tra này?")) return;
    DB.ky = DB.ky.filter(function (x) { return x.id !== kid; });
    save(); draw(); return;
  }
  if (e.target.id === "b-backky") { curKy = ""; draw(); window.scrollTo(0, 0); return; }
  if (e.target.id === "b-addfi" || e.target.id === "b-addfi2") {
    var k = kyById(curKy); if (!k) return;
    if (!k.items) k.items = [];
    k.items.push({ nd: "", bp: "khac", pl: "nc", cc: "", han: "", tn: "", tt: "open" });
    save(); draw(); return;
  }
  t = e.target.closest("[data-fidel]");
  if (t) {
    var kk = kyById(curKy); if (!kk) return;
    kk.items.splice(+t.getAttribute("data-fidel"), 1);
    save(); draw(); return;
  }
  if (e.target.id === "b-docx") { document.getElementById("f-docx").click(); return; }
  if (e.target.id === "b-paste") { openPaste(); return; }

  t = e.target.closest("[data-rep]");
  if (t) { doReport(t.getAttribute("data-rep"), t.getAttribute("data-ky")); return; }

  if (e.target.id === "sheet") closeSheet();
});
document.body.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "f-ship" || t.id === "f-ship2" || t.id === "f-ship3") {
    curShip = t.value; save(); draw(); return;
  }
  if (t.id === "f-docx") {
    if (!t.files || !t.files.length) return;
    var file = t.files[0]; t.value = "";
    docxText(file, function (txt, err) {
      if (err) { alert(err); return; }
      var kk0 = kyById(curKy);
      var rows = parseRows(txt, kk0 ? kk0.loai : "", kk0 ? kk0.ngay : "");
      if (!rows.length) { alert("Không tách được dòng nào từ file. Hãy thử nút “Dán bảng từ Word”."); return; }
      var k = kyById(curKy); if (!k) return;
      if (!k.items) k.items = [];
      k.items = k.items.concat(rows);
      if (!k.nguon) k.nguon = file.name;
      save(); draw();
      alert("Đã nạp " + rows.length + " dòng từ file. Hãy kiểm tra lại mảng và phân loại của từng dòng.");
    });
    return;
  }
  var kf = t.getAttribute && t.getAttribute("data-kf");
  if (kf) { var k2 = kyById(curKy); if (k2) { k2[kf] = t.value; save(); if (kf === "loai" || kf === "shipId") draw(); } return; }
  var fi = t.getAttribute && t.getAttribute("data-fi");
  if (fi !== null && fi !== undefined && t.getAttribute("data-ff")) {
    var k3 = kyById(curKy); if (!k3) return;
    k3.items[+fi][t.getAttribute("data-ff")] = t.value;
    save();
    if (t.getAttribute("data-ff") === "tt" || t.getAttribute("data-ff") === "han") draw();
    return;
  }
});
document.body.addEventListener("input", function (e) {
  var t = e.target;
  var kf = t.getAttribute && t.getAttribute("data-kf");
  if (kf) { var k = kyById(curKy); if (k) { k[kf] = t.value; save(); } return; }
  var fi = t.getAttribute && t.getAttribute("data-fi");
  if (fi !== null && fi !== undefined && t.getAttribute("data-ff")) {
    var k2 = kyById(curKy); if (!k2) return;
    k2.items[+fi][t.getAttribute("data-ff")] = t.value;
    save();
  }
});

/* ---------- form tàu ---------- */
function editShip(id) {
  var s = id ? shipById(id) : { id: "", ten: "", loai: "", imo: "" };
  openSheet("<h2>" + (id ? "Sửa tàu" : "Thêm tàu") + "</h2>" +
    '<div class="card">' +
    '<label class="f"><b>Tên tàu</b><input id="s-ten" value="' + esc(s.ten) + '" placeholder="VD Long Hải 02"></label>' +
    '<label class="f"><b>Loại tàu</b><input id="s-loai" value="' + esc(s.loai) + '" placeholder="VD Tàu dịch vụ, tàu kéo…"></label>' +
    '<label class="f"><b>Số IMO</b><input id="s-imo" value="' + esc(s.imo) + '"></label>' +
    '</div><div class="btns"><button class="b pri" id="s-ok">Lưu</button>' +
    '<button class="b" id="s-cancel">Hủy</button></div>');
  document.getElementById("s-ok").onclick = function () {
    var ten = document.getElementById("s-ten").value.replace(/^\s+|\s+$/g, "");
    if (!ten) { alert("Nhập tên tàu."); return; }
    if (id) {
      s.ten = ten; s.loai = document.getElementById("s-loai").value; s.imo = document.getElementById("s-imo").value;
    } else {
      DB.ships.push({ id: uid(), ten: ten, loai: document.getElementById("s-loai").value,
        imo: document.getElementById("s-imo").value });
    }
    closeSheet(); save(); draw();
  };
  document.getElementById("s-cancel").onclick = closeSheet;
}
function addKy() {
  var sid = curShip || (DB.ships[0] && DB.ships[0].id);
  if (!sid) { alert("Thêm tàu trước đã."); return; }
  var k = { id: uid(), shipId: sid, loai: "c4", ngay: today(), so: "", doan: "", nguon: "", items: [] };
  DB.ky.push(k); curKy = k.id; save(); draw(); window.scrollTo(0, 0);
}
function openPaste() {
  openSheet("<h2>Dán bảng từ Word</h2>" +
    '<div class="card"><div class="muted">Mở biên bản trong Word, bôi đen bảng phát hiện rồi copy, dán vào ô dưới. ' +
    'Máy sẽ tự tách thành từng dòng và đoán mảng, thời hạn, phân loại — nhập xong nhớ soát lại.<br><br>' +
    '<b>Quan trọng:</b> cột được đọc theo LOẠI KIỂM TRA đã chọn ở phần trên, nên chọn đúng loại trước khi dán.</div>' +
    '<textarea id="p-txt" style="min-height:180px;margin-top:10px" placeholder="Dán nội dung vào đây…"></textarea></div>' +
    '<div class="btns"><button class="b pri" id="p-ok">Tách thành dòng</button>' +
    '<button class="b" id="p-cancel">Hủy</button></div>');
  document.getElementById("p-ok").onclick = function () {
    var kp = kyById(curKy);
    var rows = parseRows(document.getElementById("p-txt").value, kp ? kp.loai : "", kp ? kp.ngay : "");
    if (!rows.length) { alert("Không tách được dòng nào. Kiểm tra lại nội dung đã dán."); return; }
    var k = kyById(curKy); if (!k) return;
    if (!k.items) k.items = [];
    k.items = k.items.concat(rows);
    closeSheet(); save(); draw();
    alert("Đã thêm " + rows.length + " dòng. Hãy soát lại mảng và phân loại của từng dòng.");
  };
  document.getElementById("p-cancel").onclick = closeSheet;
}
var scrollY0 = 0;
function openSheet(html) {
  document.getElementById("sheetIn").innerHTML = html;
  document.getElementById("sheet").hidden = false;
  scrollY0 = window.scrollY || 0;
  document.body.style.top = (-scrollY0) + "px";
  document.body.classList.add("modal-open");
}
function closeSheet() {
  document.getElementById("sheet").hidden = true;
  document.body.classList.remove("modal-open");
  document.body.style.top = "";
  window.scrollTo(0, scrollY0);
}

function doReport(kind, kyId) {
  try {
    var bytes, fn;
    if (kind === "sw") {
      var s = shipById(curShip);
      if (!analyse(curShip).all.length) { alert("Chưa có dữ liệu để lập báo cáo."); return; }
      bytes = repSW();
      fn = "Bao-cao-diem-manh-diem-yeu-" + slug(s ? s.ten : "toan-doi-tau") + ".docx";
    } else {
      var k = kyById(kyId);
      if (!k) { alert("Không tìm thấy kỳ kiểm tra."); return; }
      var sh = shipById(k.shipId);
      if (kind === "c4") { bytes = repC4(k); fn = "Bien-ban-cap-IV-"; }
      else if (kind === "c3") { bytes = repC3(k); fn = "Danh-muc-ghi-nhan-NC-"; }
      else { bytes = repTT(k); fn = "Bao-cao-tinh-trang-tau-"; }
      fn += slug(sh ? sh.ten : "tau") + "-" + (k.ngay || "") + ".docx";
    }
    saveBlob(bytes, fn);
  } catch (err) {
    alert("Không tạo được file: " + err.message);
  }
}

/* ===================== KHỞI ĐỘNG ===================== */
load();
draw();
</script>
